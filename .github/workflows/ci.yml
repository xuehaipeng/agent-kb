name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    strategy:
      # Report every OS: path bugs (e.g. macOS /var -> /private/var) are platform-specific.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: make lint
      - run: go test -race ./...
      - run: go build -o kb ./cmd/kb && ./kb lint --root knowledge
